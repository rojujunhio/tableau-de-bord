function mettreAJourBadge() {
  if (!('setAppBadge' in navigator)) return;
  try {
    const n = prioritesDuJour().filter(t => !tacheFinie(t)).length;
    const p = n > 0 ? navigator.setAppBadge(n) : navigator.clearAppBadge();
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* badge non pris en charge */ }
}

/* =====================================================================
   EXPORT / IMPORT
   ===================================================================== */
async function exporter() {
  const jour = aujourdhui();
  const nom = `tableau-de-bord-${jour}.json`;
  const donnees = { ...etat, minuteur: null, dernierExport: jour };
  const contenu = JSON.stringify({ application: 'tableau-de-bord', exporteLe: new Date().toISOString(), donnees }, null, 2);
  const blob = new Blob([contenu], { type: 'application/json' });
  const tactile = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  if (tactile && navigator.canShare && navigator.share) {
    try {
      const fichier = new File([blob], nom, { type: 'application/json' });
      if (navigator.canShare({ files: [fichier] })) {
        await navigator.share({ files: [fichier] });
        noterExport(jour);
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  noterExport(jour);
}
function noterExport(jour) { etat.dernierExport = jour; sauver(); rendreTout(); }

async function importer(fichier) {
  let d;
  try {
    d = JSON.parse(await fichier.text());
    if (d && d.application === 'tableau-de-bord' && d.donnees) d = d.donnees;
  } catch (e) { d = null; }
  if (!formatValide(d)) {
    alert('Ce fichier n’est pas une sauvegarde valide du tableau de bord. Rien n’a été modifié.');
    return;
  }
  if (!confirm('Ceci va remplacer toutes tes données actuelles. Continuer ?')) return;
  const garde = etat.dernierExport;
  etat = normaliser(d);
  if (garde && (!etat.dernierExport || garde > etat.dernierExport)) etat.dernierExport = garde;
  ui.tacheOuverte = ui.habitudeEditee = ui.objectifEdite = null;
  ui.assistant = null; ui.minuteurFini = false;
  sauver(); rendreTout();
  alert('Données importées.');
}

function effacerExemples() {
  if (!confirm('Effacer toutes les données d’exemple ? Ce que tu as ajouté toi-même est conservé.')) return;
  const garder = x => !x.exemple;
  const objRestants = new Set(etat.objectifs.filter(garder).map(o => o.id));
  etat.objectifs = etat.objectifs.filter(garder);
  etat.taches = etat.taches.filter(garder);
  etat.taches.forEach(t => { if (t.objectif && !objRestants.has(t.objectif)) t.objectif = null; });
  etat.habitudes = etat.habitudes.filter(garder);
  etat.capture = etat.capture.filter(garder);
  for (const [j, p] of Object.entries(etat.priorites)) {
    p.taches = p.taches.filter(id => tache(id));
    if (p.exemple) delete etat.priorites[j];
  }
  ui.tacheOuverte = ui.habitudeEditee = ui.objectifEdite = null;
  sauver(); rendreTout();
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
function retirerDesPriorites(idTache) {
  for (const p of Object.values(etat.priorites)) p.taches = p.taches.filter(id => id !== idTache);
}
function capturerEnTache(id) {
  const c = etat.capture.find(x => x.id === id);
  if (!c) return;
  etat.taches.push({ id: nouvelId(), titre: c.texte, objectif: null, faite: false, faiteLe: null, etapes: [] });
  etat.capture = etat.capture.filter(x => x.id !== id);
}
function voieLibre() { const prises = new Set(etat.objectifs.map(o => o.voie)); return [0, 1, 2].find(v => !prises.has(v)) ?? 0; }

const clics = {
  'exporter': () => exporter(),
  'importer': () => { const f = $('#fichier-import'); f.value = ''; f.click(); },
  'effacer-exemple': () => effacerExemples(),
  'activer-badge': async () => {
    try { await Notification.requestPermission(); } catch (e) {}
    mettreAJourBadge(); rendreTout();
  },
  'preparer-demain': () => ouvrirAssistant(decaler(aujourdhui(), 1), 1),
  'choisir-maintenant': () => ouvrirAssistant(aujourdhui(), 2),
  'prio-annuler': el => {
    const t = tache(el.dataset.tache); if (!t) return;
    if (t.etapes.length) marquer(t.etapes[t.etapes.length - 1], false); else marquer(t, false);
    ui.retourner = t.id;
    sauver(); rendreTout();
  },
  'minuteur-demarrer': () => {
    preparerSon();
    const t = prioritesDuJour()[0];
    etat.minuteur = { fin: Date.now() + DUREE_MINUTEUR, tache: t ? t.id : null };
    ui.minuteurFini = false; sauver(); rendreTout();
  },
  'minuteur-arreter': () => { etat.minuteur = null; sauver(); rendreTout(); },
  'minuteur-ok': () => { ui.minuteurFini = false; rendreTout(); },
  'capture-tache': el => { capturerEnTache(el.dataset.id); sauver(); rendreTout(); },
  'capture-suppr': el => { etat.capture = etat.capture.filter(x => x.id !== el.dataset.id); sauver(); rendreTout(); },
  'tache-ouvrir': el => { ui.tacheOuverte = ui.tacheOuverte === el.dataset.id ? null : el.dataset.id; rendreTout(); },
  'tache-suppr': el => {
    const t = tache(el.dataset.id); if (!t) return;
    if (!confirm(`Supprimer la tâche « ${t.titre} » ?`)) return;
    etat.taches = etat.taches.filter(x => x.id !== t.id);
    retirerDesPriorites(t.id);
    ui.tacheOuverte = null; sauver(); rendreTout();
  },
  'etape-monter': el => deplacerEtape(el, -1),
  'etape-descendre': el => deplacerEtape(el, 1),
  'etape-suppr': el => {
    const t = tache(el.dataset.id); if (!t) return;
    const avant = tacheFinie(t);
    t.etapes = t.etapes.filter(e => e.id !== el.dataset.etape);
    if (!t.etapes.length) marquer(t, avant);
    sauver(); rendreTout();
  },
  'habitude-editer': el => { ui.habitudeEditee = ui.habitudeEditee === el.dataset.id ? null : el.dataset.id; rendreTout(); },
  'habitude-suppr': el => {
    const h = habitude(el.dataset.id); if (!h) return;
    if (!confirm(`Supprimer l’habitude « ${h.nom} » et tout son historique ?`)) return;
    etat.habitudes = etat.habitudes.filter(x => x.id !== h.id);
    ui.habitudeEditee = null; sauver(); rendreTout();
  },
  'objectif-editer': el => { ui.objectifEdite = ui.objectifEdite === el.dataset.id ? null : el.dataset.id; rendreTout(); },
  'objectif-suppr': el => {
    const o = objectif(el.dataset.id); if (!o) return;
    if (!confirm(`Supprimer l’objectif « ${o.titre} » ? Ses tâches sont conservées dans « Sans objectif ».`)) return;
    etat.objectifs = etat.objectifs.filter(x => x.id !== o.id);
    etat.taches.forEach(t => { if (t.objectif === o.id) t.objectif = null; });
    ui.objectifEdite = null; sauver(); rendreTout();
  },
  'assist-fermer': () => { ui.assistant = null; rendreTout(); },
  'assist-retour': () => { const A = ui.assistant; if (A.etape > 1) { A.etape--; A.garderDefilement = false; } rendreTout(); },
  'assist-suivant': () => {
    const A = ui.assistant;
    if (A.etape === 2 && (A.choix.length < 1 || A.choix.length > MAX_PRIORITES)) return;
    if (A.etape < 4) { A.etape++; A.garderDefilement = false; }
    rendreTout();
  },
  'assist-valider': () => validerAssistant()
};

function deplacerEtape(el, sens) {
  const t = tache(el.dataset.id); if (!t) return;
  const i = t.etapes.findIndex(e => e.id === el.dataset.etape);
  const j = i + sens;
  if (i < 0 || j < 0 || j >= t.etapes.length) return;
  [t.etapes[i], t.etapes[j]] = [t.etapes[j], t.etapes[i]];
  sauver(); rendreTout();
  const meme = document.querySelector(`[data-action="${sens < 0 ? 'etape-monter' : 'etape-descendre'}"][data-etape="${el.dataset.etape}"]`);
  if (meme && !meme.disabled) meme.focus({ preventScroll: true });
}

const changements = {
  'prio-cocher': el => {
    const t = tache(el.dataset.tache); if (!t) return;
    if (el.dataset.etape) { const e = t.etapes.find(x => x.id === el.dataset.etape); if (e) marquer(e, el.checked); }
    else marquer(t, el.checked);
    ui.retourner = t.id;
    sauver(); rendreTout();
  },
  'tache-cocher': el => { const t = tache(el.dataset.id); if (t) { marquer(t, el.checked); sauver(); rendreTout(); } },
  'etape-cocher': el => {
    const t = tache(el.dataset.id); const e = t && t.etapes.find(x => x.id === el.dataset.etape);
    if (e) { marquer(e, el.checked); sauver(); rendreTout(); }
  },
  // Les renommages ne redessinent pas la page (pour ne pas « avaler » le toucher suivant)
  'tache-renommer': el => {
    const t = tache(el.dataset.id); const v = el.value.trim();
    if (!t) return; if (!v) { el.value = t.titre; return; }
    t.titre = v; sauver(); majTextes(`[data-nom-tache="${t.id}"]`, v);
  },
  'etape-renommer': el => {
    const t = tache(el.dataset.id); const e = t && t.etapes.find(x => x.id === el.dataset.etape);
    if (!e) return; const v = el.value.trim();
    if (!v) { el.value = e.texte; return; }
    e.texte = v; sauver(); majTextes(`[data-nom-etape="${e.id}"]`, v);
  },
  'tache-objectif': el => { const t = tache(el.dataset.id); if (t) { t.objectif = el.value || null; sauver(); rendreTout(); } },
  'habitude-cocher': el => {
    const h = habitude(el.dataset.id); if (!h) return;
    if (el.checked) h.jours[el.dataset.jour] = true; else delete h.jours[el.dataset.jour];
    sauver(); rendreTout();
  },
  'habitude-renommer': el => {
    const h = habitude(el.dataset.id); const v = el.value.trim();
    if (!h) return; if (!v) { el.value = h.nom; return; }
    h.nom = v; sauver(); majTextes(`[data-nom-habitude="${h.id}"]`, v);
  },
  'objectif-renommer': el => {
    const o = objectif(el.dataset.id); const v = el.value.trim();
    if (!o) return; if (!v) { el.value = o.titre; return; }
    o.titre = v; sauver(); majTextes(`[data-nom-objectif="${o.id}"]`, v);
  },
  'assist-choisir': el => {
    const A = ui.assistant; const id = el.dataset.id;
    if (el.checked) { if (A.choix.length < MAX_PRIORITES && !A.choix.includes(id)) A.choix.push(id); }
    else A.choix = A.choix.filter(x => x !== id);
    rendreTout();
  }
};
function majTextes(selecteur, texte) { document.querySelectorAll(selecteur).forEach(n => { n.textContent = texte; }); }

const formulaires = {
  'capture-ajouter': f => { const v = f.texte.value.trim(); if (!v) return; etat.capture.push({ id: nouvelId(), texte: v }); },
  'tache-ajouter': f => {
    const v = f.titre.value.trim(); if (!v) return;
    etat.taches.push({ id: nouvelId(), titre: v, objectif: f.objectif.value || null, faite: false, faiteLe: null, etapes: [] });
  },
  'etape-ajouter': f => {
    const t = tache(f.dataset.id); const v = f.texte.value.trim(); if (!t || !v) return;
    t.etapes.push({ id: nouvelId(), texte: v, faite: false, faiteLe: null });
  },
  'habitude-ajouter': f => { const v = f.nom.value.trim(); if (!v) return; etat.habitudes.push({ id: nouvelId(), nom: v, jours: {} }); },
  'objectif-ajouter': f => {
    const v = f.titre.value.trim(); if (!v || etat.objectifs.length >= MAX_OBJECTIFS) return;
    etat.objectifs.push({ id: nouvelId(), titre: v, voie: voieLibre() });
  },
  'assist-nouvelle-tache': f => {
    const v = f.titre.value.trim(); if (!v) return;
    const t = { id: nouvelId(), titre: v, objectif: null, faite: false, faiteLe: null, etapes: [] };
    etat.taches.push(t);
    if (ui.assistant.choix.length < MAX_PRIORITES) ui.assistant.choix.push(t.id);
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.tagName === 'FORM' || el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
  const f = clics[el.dataset.action];
  if (f) f(el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'fichier-import') { if (el.files && el.files[0]) importer(el.files[0]); return; }
  const f = el.dataset && changements[el.dataset.action];
  if (f) f(el, e);
});
// Champs de texte qui s'agrandissent avec leur contenu (si le navigateur ne le fait pas seul)
const tailleAuto = !(window.CSS && CSS.supports && CSS.supports('field-sizing', 'content'));
function ajuster(el) { if (!tailleAuto) return; el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; }
function ajusterTout() { document.querySelectorAll('textarea.auto').forEach(ajuster); }
document.addEventListener('input', e => {
  if (e.target.matches && e.target.matches('textarea.auto')) ajuster(e.target);
  const el = e.target, A = ui.assistant;
  if (!A || !el.dataset) return;
  if (el.dataset.action === 'assist-saisie') A.saisies[el.dataset.id] = el.value;
  if (el.dataset.action === 'assist-note') A.note = el.value;
});
document.addEventListener('submit', e => {
  const f = e.target;
  const action = formulaires[f.dataset.action];
  if (!action) return;
  e.preventDefault();
  const champ = f.querySelector('input[type=text]');
  if (champ && champ.dataset.fk) champ.focus({ preventScroll: true });
  action(f);
  sauver(); rendreTout();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.assistant) { ui.assistant = null; rendreTout(); }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-action$="-renommer"], input[data-action="assist-saisie"], input[data-action="assist-note"]')) {
    e.preventDefault(); e.target.blur();
  }
});

/* ----- Barre de sections : surligne la section visible ----- */
function majSectionActive() {
  const ids = ['haut', 'taches', 'habitudes', 'objectifs'];
  const seuil = ($('#sections').getBoundingClientRect().bottom || 0) + 24;
  let actif = 'haut';
  for (const id of ids) { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top <= seuil) actif = id; }
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) actif = 'objectifs';
  document.querySelectorAll('#sections a').forEach(a => a.classList.toggle('actif', a.dataset.section === actif));
}
window.addEventListener('scroll', majSectionActive, { passive: true });
window.addEventListener('resize', majSectionActive);

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
charger();
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(() => {});
}
if (etat.minuteur && etat.minuteur.fin <= Date.now()) finirMinuteur();
rendreTout();
majSectionActive();
mettreAJourBadge();
setInterval(tic, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tic(); mettreAJourBadge(); } });
window.addEventListener('pageshow', () => tic());
</script>
